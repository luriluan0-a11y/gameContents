<style>

  header{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:36px 20px 30px}
  .wrap{max-width:1040px;margin:0 auto}
  header h1{margin:0 0 8px;font-size:26px;letter-spacing:-.02em}
  header p{margin:0;color:#dce7f3;font-size:14px}
  .meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .meta-badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
  main{padding:26px 20px 60px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
  .toolbar input, .toolbar select{
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;color:var(--text);
  }
  .toolbar input{flex:1 1 240px}
  .toolbar select{flex:0 0 140px}
  h2.section-title{font-size:19px;color:var(--navy);margin:30px 0 12px;padding-left:12px;border-left:5px solid var(--orange)}
  .count-tag{color:var(--muted);font-weight:500;font-size:14px;margin-left:6px}
  .cards{display:grid;gap:12px}
  .job-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;box-shadow:0 4px 12px rgba(26,58,92,.05)}
  .job-main{flex:1 1 320px;min-width:0}
  .job-company{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:3px}
  .job-title{font-size:15.5px;font-weight:700;color:var(--text)}
  .job-tags{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
  .tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .tag-career{background:#eaf1fb;color:var(--blue)}
  .tag-unknown{background:#f1f2f5;color:var(--muted)}
  .tag-always{background:#eef7ee;color:#2f7a3d}
  .tag-deadline{background:#fdeee9;color:var(--danger)}
  .tag-soon{background:var(--danger);color:#fff}
  .job-link{flex:0 0 auto}
  .job-link a{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;transition:.15s background}
  .job-link a:hover{background:var(--blue)}
  .empty-msg{color:var(--muted);text-align:center;padding:30px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
  .note-box{background:#fff8e8;border:1px solid #f0dca0;border-radius:14px;padding:16px 20px;margin-top:34px;font-size:13.5px;color:#5c4a12}
  .note-box ul{margin:8px 0 0;padding-left:20px}
  footer{color:var(--muted);font-size:12.5px;text-align:center;padding:26px 20px 44px}
  @media(max-width:560px){
    .job-card{flex-direction:column;align-items:flex-start}
    .job-link{width:100%}
    .job-link a{width:100%;text-align:center}
  }
</style>
</head>

    <div class="meta-row">

      <span class="meta-badge">총 33건</span>
    </div>

</header>

<main class="wrap">

    <input type="text" id="searchBox" placeholder="회사명 또는 공고 제목으로 검색...">
    <select id="deadlineFilter">
      <option value="all">전체 마감상태</option>
      <option value="dated">마감일 지정</option>
      <option value="always">상시채용</option>

  <h2 class="section-title">QA / 테스터 <span class="count-tag" id="qaCount"></span></h2>

  <h2 class="section-title">GM / 게임운영 <span class="count-tag" id="gmCount"></span></h2>
  <div class="cards" id="gmList"></div>

<footer>10_working/15_students/gameJob_QA_GM_2026-08-20.md 기반 · 정보 출처: gamejob.co.kr</footer>

];

const gmJobs = [
  {company:"히든몬스터", title:"모바일 게임 운영 매니저 모집 (외국어 가능자)", career:"경력 1년 이상", deadline:"2026-09-02", gi:283410},
  {company:"㈜드림아이디어소프트", title:"[대구] RPG 게임 고객센터 및 커뮤니티 고객 관리", career:null, deadline:null, gi:283844},
  {company:"㈜드림아이디어소프트", title:"[대구] 게임 GM 채용 [원더킹][세피루스]", career:"신입/경력 무관", deadline:null, gi:283637},
  {company:"㈜드림아이디어소프트", title:"[대구] PC, 모바일 게임 서비스 운영 (이벤트기획·마케터)", career:null, deadline:null, gi:283638},
];

function dDay(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const diff = Math.round((d - TODAY) / 86400000);
  return diff;
}

function renderJob(j){
  const el = document.createElement('div');
  el.className = 'job-card';
  el.dataset.search = (j.company + ' ' + j.title).toLowerCase();
  el.dataset.deadlineType = j.deadline ? 'dated' : 'always';

  let tagsHtml = '';
  tagsHtml += j.career
    ? `<span class="tag tag-career">${j.career}</span>`
    : `<span class="tag tag-unknown">경력 미확인</span>`;

  if(j.deadline){
    const diff = dDay(j.deadline);
    const label = diff >= 0 ? `마감 ${j.deadline} (D-${diff})` : `마감 ${j.deadline} (지남)`;
    tagsHtml += `<span class="tag ${diff <= 7 ? 'tag-soon' : 'tag-deadline'}">${label}</span>`;
  } else {
    tagsHtml += `<span class="tag tag-always">상시채용</span>`;
  }

  el.innerHTML = `
    <div class="job-main">
      <div class="job-company">${j.company}</div>
      <div class="job-title">${j.title}</div>
    </div>
    <div class="job-tags">${tagsHtml}</div>
    <div class="job-link"><a href="https://www.gamejob.co.kr/Recruit/GI_Read/View?GI_No=${j.gi}" target="_blank" rel="noopener">공고 보기</a></div>
  `;
  return el;
}

const qaListEl = document.getElementById('qaList');
const gmListEl = document.getElementById('gmList');

function renderAll(){
  qaListEl.innerHTML = '';
  gmListEl.innerHTML = '';
  qaJobs.forEach(j => qaListEl.appendChild(renderJob(j)));
  gmJobs.forEach(j => gmListEl.appendChild(renderJob(j)));
  document.getElementById('qaCount').textContent = `(${qaJobs.length}건)`;
  document.getElementById('gmCount').textContent = `(${gmJobs.length}건)`;
  applyFilters();
}

function applyFilters(){
  const kw = document.getElementById('searchBox').value.trim().toLowerCase();
  const deadlineMode = document.getElementById('deadlineFilter').value;
  let qaVisible = 0, gmVisible = 0;

  document.querySelectorAll('.job-card').forEach(card => {
    const matchKw = !kw || card.dataset.search.includes(kw);
    const matchDeadline = deadlineMode === 'all' || card.dataset.deadlineType === deadlineMode;
    const show = matchKw && matchDeadline;
    card.style.display = show ? '' : 'none';
    if(show){
      if(card.parentElement.id === 'qaList') qaVisible++;
      else gmVisible++;
    }
  });

  toggleEmptyState(qaListEl, qaVisible);
  toggleEmptyState(gmListEl, gmVisible);
}

function toggleEmptyState(listEl, visibleCount){
  let empty = listEl.querySelector('.empty-msg');
  if(visibleCount === 0){
    if(!empty){
      empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = '조건에 맞는 공고가 없습니다.';
      listEl.appendChild(empty);
    }
  } else if(empty){
    empty.remove();
  }
}

document.getElementById('searchBox').addEventListener('input', applyFilters);
document.getElementById('deadlineFilter').addEventListener('change', applyFilters);

renderAll();
</script>

</html>
