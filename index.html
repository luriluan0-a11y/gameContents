<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이윤임 - 컴퓨터공학과 게임콘텐츠전공</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #f8f9fa;
      color: #212529;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #4f6ef7, #6c8cff);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: #1a1a2e;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #6c757d;
      margin-bottom: 1.5rem;
    }

    .email {
      display: inline-block;
      font-size: 0.9rem;
      color: #4f6ef7;
      text-decoration: none;
      background: #eef0ff;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      margin-bottom: 2.5rem;
      transition: background 0.2s;
    }

    .email:hover {
      background: #dde1ff;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #adb5bd;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }

    .lecture-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 1.1rem 1.4rem;
      text-decoration: none;
      color: #212529;
      transition: all 0.2s;
    }

    .lecture-link:hover {
      background: #eef0ff;
      border-color: #4f6ef7;
      color: #4f6ef7;
    }

    .lecture-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .lecture-text {
      text-align: left;
    }

    .lecture-text strong {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .lecture-text span {
      font-size: 0.8rem;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👩‍💻</div>

    <h1>이윤임</h1>
    <p class="subtitle">유한대학교 컴퓨터공학과 게임콘텐츠전공</p>

    <a class="email" href="mailto:luriluan@naver.com">luriluan@naver.com</a>

    <p class="section-title">특강 자료</p>
    <a class="lecture-link" href="01_ai_literacy.html">
      <span class="lecture-icon">🤖</span>
      <div class="lecture-text">
        <strong>AI 리터러시 가이드</strong>
        <span>AI는 눈치가 없다</span>
      </div>
    </a>
  </div>
</body>
</html>
