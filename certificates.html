<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자격·수료·수상 — 이윤임</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap');

    :root {
      --bg:        #090b0f;
      --bg2:       #0f1117;
      --bg3:       #161b24;
      --border:    #1e2433;
      --text:      #d4d9e8;
      --muted:     #5a6278;
      --accent:    #4a7fbf;
      --accent2:   #3d8a72;
      --dim:       #2a3246;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Noto Sans KR', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: radial-gradient(circle, #1a2035 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(9,11,15,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; gap: 1.5rem;
      height: 52px;
    }
    .nav-brand {
      font-family: var(--mono);
      font-size: 0.85rem; color: var(--accent);
      white-space: nowrap; text-decoration: none;
    }
    .nav-brand span { color: var(--muted); }
    .nav-links { display: flex; gap: 0.4rem; }
    .nav-links a {
      font-size: 0.78rem; color: white;
      text-decoration: none; padding: 4px 12px;
      border-radius: 4px; transition: color 0.2s, background 0.2s;
    }
    .nav-links a:hover { color: var(--text); background: var(--bg3); }

    /* ── MAIN LAYOUT ── */
    .container {
      max-width: 1100px; margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
      display: flex; flex-direction: column; gap: 3rem;
    }

    .page-head h1 { font-size: 1.55rem; font-weight: 700; margin-bottom: 0.3rem; }
    .page-head p {
      font-family: var(--mono); font-size: 0.78rem; color: var(--accent);
    }

    /* ── SECTION HEADER ── */
    .sec-header {
      display: flex; align-items: center; gap: 0.8rem;
      margin-bottom: 1.2rem;
    }
    .sec-label {
      font-family: var(--mono); font-size: 0.72rem;
      color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase;
    }
    .sec-count { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
    .sec-line { flex: 1; height: 1px; background: var(--border); }
    .sec-more {
      font-family: var(--mono); font-size: 0.72rem; font-weight: 600; color: #0a0f18;
      text-decoration: none; border: 1px solid var(--accent); border-radius: 4px;
      padding: 3px 12px; background: #7fb0ec;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .sec-more:hover { background: #9cc4f5; transform: translateY(-1px); }

    /* ── CERTIFICATIONS ── */
    .cert-grid {
      display: flex; flex-wrap: wrap; gap: 0.8rem;
    }
    .cert-item {
      border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; background: var(--bg2);
      transition: border-color 0.2s;
      width: 180px;
    }
    .cert-item:hover { border-color: var(--accent); }
    .cert-item a { display: flex; justify-content: center; }
    .cert-thumb {
      width: 180px; height: 240px;
      object-fit: cover; display: block;
      cursor: pointer;
    }
    .cert-item b {
      display: block; padding: 0.5rem 0.7rem;
      font-size: 0.88rem; font-weight: 600;
      text-align: center;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.8rem 1.5rem;
      text-align: center;
      font-family: var(--mono); font-size: 0.5rem; color: var(--muted);
    }

    @media (max-width: 540px) {
      nav .nav-links { display: none; }
      .cert-grid { justify-content: center; }
    }
  </style>
</head>
